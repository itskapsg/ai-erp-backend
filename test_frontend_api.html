<!DOCTYPE html>
<html>
<head>
    <title>Frontend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-left: 3px solid #007bff; }
    </style>
</head>
<body>
    <h1>Frontend API Test</h1>
    <p>Testing the exact same API calls that the React frontend makes</p>
    
    <div class="test-section">
        <h3>Test 1: Direct Fetch API (Same as React)</h3>
        <button onclick="testDirectFetch()">Test Direct Fetch</button>
        <div id="fetch-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Axios (Same as React)</h3>
        <button onclick="testAxios()">Test Axios</button>
        <div id="axios-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: All Demo Users</h3>
        <button onclick="testAllUsers()">Test All Demo Users</button>
        <div id="users-result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8001/api/v1';
        
        function log(elementId, message, isSuccess = false) {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = 'log';
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            if (isSuccess) {
                div.style.borderLeftColor = '#28a745';
                div.style.background = '#d4edda';
            } else if (message.includes('❌')) {
                div.style.borderLeftColor = '#dc3545';
                div.style.background = '#f8d7da';
            }
            element.appendChild(div);
        }

        async function testDirectFetch() {
            const resultId = 'fetch-result';
            document.getElementById(resultId).innerHTML = '';
            
            try {
                log(resultId, '🔍 Testing direct fetch (same as React frontend)...');
                
                const formData = new FormData();
                formData.append('username', 'admin');
                formData.append('password', 'admin123');
                
                log(resultId, '📤 Sending POST request with FormData...');
                
                const response = await fetch(`${API_BASE_URL}/auth/token`, {
                    method: 'POST',
                    body: formData,
                    // Don't set Content-Type, let browser handle it for FormData
                });
                
                log(resultId, `📥 Response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(resultId, `✅ SUCCESS! Token: ${data.access_token.substring(0, 50)}...`, true);
                    log(resultId, `User: ${data.username}, Role: ${data.role}`, true);
                } else {
                    const errorText = await response.text();
                    log(resultId, `❌ FAILED: ${response.status} - ${errorText}`);
                }
            } catch (error) {
                log(resultId, `❌ ERROR: ${error.message}`);
                log(resultId, `Stack: ${error.stack}`);
            }
        }

        async function testAxios() {
            const resultId = 'axios-result';
            document.getElementById(resultId).innerHTML = '';
            
            try {
                log(resultId, '🔍 Testing Axios (same as React frontend)...');
                
                // Create axios instance with same config as React app
                const api = axios.create({
                    baseURL: API_BASE_URL,
                    timeout: 10000,
                });
                
                const formData = new FormData();
                formData.append('username', 'admin');
                formData.append('password', 'admin123');
                
                log(resultId, '📤 Sending POST request with Axios...');
                
                const response = await api.post('/auth/token', formData, {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                });
                
                log(resultId, `📥 Response: ${response.status} ${response.statusText}`);
                
                const { access_token, user_id, username, role } = response.data;
                log(resultId, `✅ SUCCESS! Token: ${access_token.substring(0, 50)}...`, true);
                log(resultId, `User: ${username}, Role: ${role}`, true);
                
                // Test storing in localStorage (same as React)
                localStorage.setItem('token', access_token);
                localStorage.setItem('user', JSON.stringify({ id: user_id, username, role }));
                log(resultId, '💾 Stored in localStorage', true);
                
            } catch (error) {
                if (error.response) {
                    log(resultId, `❌ API ERROR: ${error.response.status} - ${error.response.data?.detail || error.response.statusText}`);
                } else {
                    log(resultId, `❌ NETWORK ERROR: ${error.message}`);
                }
            }
        }

        async function testAllUsers() {
            const resultId = 'users-result';
            document.getElementById(resultId).innerHTML = '';
            
            const users = [
                { username: 'admin', role: 'Admin' },
                { username: 'manager', role: 'Manager' },
                { username: 'accountant', role: 'Accountant' },
                { username: 'salesman', role: 'Salesman' }
            ];
            
            for (const user of users) {
                try {
                    log(resultId, `🔍 Testing ${user.role} (${user.username})...`);
                    
                    const formData = new FormData();
                    formData.append('username', user.username);
                    formData.append('password', `${user.username}123`);
                    
                    const response = await fetch(`${API_BASE_URL}/auth/token`, {
                        method: 'POST',
                        body: formData,
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(resultId, `✅ ${user.role}: Login successful - Role: ${data.role}`, true);
                    } else {
                        const errorText = await response.text();
                        log(resultId, `❌ ${user.role}: Login failed - ${response.status}: ${errorText}`);
                    }
                } catch (error) {
                    log(resultId, `❌ ${user.role}: Network error - ${error.message}`);
                }
            }
        }
    </script>
</body>
</html>
