<!DOCTYPE html>
<html>
<head>
    <title>Frontend Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        .success { border-left-color: #28a745; background: #d4edda; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>Frontend Login Debug</h1>
    
    <div>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="testLogin()">Test Login</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = 'log ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
            logDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logsDiv.appendChild(logDiv);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log('🔍 Starting login test...');
            log(`Username: ${username}, Password: ${password ? '***' : 'empty'}`);
            
            try {
                // Test the exact same way the frontend does it
                log('📤 Creating FormData...');
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                log('📤 Sending POST request to http://localhost:8001/api/v1/auth/token');
                
                const response = await fetch('http://localhost:8001/api/v1/auth/token', {
                    method: 'POST',
                    body: formData,
                    // Don't set Content-Type header, let browser set it for FormData
                });
                
                log(`📥 Response status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Login successful!`, 'success');
                    log(`Token: ${data.access_token.substring(0, 50)}...`, 'success');
                    log(`User: ${data.username}`, 'success');
                    log(`Role: ${data.role}`, 'success');
                    
                    // Test storing token
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify({
                        username: data.username,
                        role: data.role
                    }));
                    log('💾 Token and user data stored in localStorage', 'success');
                    
                } else {
                    const errorText = await response.text();
                    log(`❌ Login failed: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
                log(`Error details: ${error.stack}`, 'error');
            }
        }

        // Log initial state
        window.addEventListener('load', () => {
            log('🚀 Page loaded');
            log(`Current URL: ${window.location.href}`);
            log(`User Agent: ${navigator.userAgent}`);
            
            // Check if there's already a token
            const existingToken = localStorage.getItem('token');
            if (existingToken) {
                log(`🔑 Found existing token: ${existingToken.substring(0, 50)}...`);
            } else {
                log('🔑 No existing token found');
            }
        });
    </script>
</body>
</html>
